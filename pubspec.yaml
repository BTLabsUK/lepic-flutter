name: lepic
description: Dart bindings for the LEPIC Epic Cash wallet engine.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  # hook/build.dart. The versions the Flutter SDK's own build runner uses, so app and SDK agree on
  # the hook protocol.
  code_assets: 1.2.1
  hooks: 2.0.2
  # hook/build.dart checks the bundled library's SHA-256. The version `hooks` already brings in.
  crypto: 3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

# Read only when this package is the root, so only by its own `flutter test`; an app's pubspec
# sets its own.
hooks:
  user_defines:
    lepic:
      # Written by `cargo xtask mobile --host-test`: lepic-ffi built with the `mock` feature, which
      # an app build never uses, so it is kept apart from `native/`.
      native_dir: test_native
