name: lepic
description: Dart bindings for the LEPIC Epic Cash wallet engine.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  # hook/build.dart. The versions the Flutter SDK's own build runner uses, so app and SDK agree on
  # the hook protocol.
  code_assets: 1.2.1
  hooks: 2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
