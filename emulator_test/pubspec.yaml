name: lepic_emulator_test
description: Runs package:lepic against its Android library on an emulator.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  lepic:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

hooks:
  user_defines:
    lepic:
      # Written by `cargo xtask mobile --emulator-test`: lepic-ffi built with the `mock` feature,
      # which an app build never uses, so it is kept apart from `../native/`.
      native_dir: native
